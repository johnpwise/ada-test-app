name: CI

run-name: "ADA-CI pr=${{ github.event.pull_request.number }} base=${{ github.event.pull_request.base.ref }} head=${{ github.event.pull_request.head.ref }} sha=${{ github.event.pull_request.head.sha }}"

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  app:
    name: app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Component tests
        run: npm run test:component